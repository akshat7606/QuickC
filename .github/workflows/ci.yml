name: CI (backend + frontend)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Create venv & install requirements
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Start uvicorn (background)
        run: |
          . .venv/bin/activate
          nohup .venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --reload > backend-run.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend to respond
        run: |
          echo "Waiting for http://localhost:8000/ (max 60s)"
          n=0
          until curl -sS http://localhost:8000/ > /dev/null 2>&1 || [ $n -ge 60 ]; do
            n=$((n+1))
            sleep 1
          done
          if [ $n -ge 60 ]; then
            echo "Backend did not become ready in time. Showing last 200 lines of backend-run.log"; tail -n 200 backend-run.log; exit 1
          fi

      - name: Smoke test backend root
        run: |
          curl -sS http://localhost:8000/ | sed -n '1,120p'

      - name: Run backend tests (if any)
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then
            . .venv/bin/activate
            pip install pytest
            pytest -q
          else
            echo "No pytest config or tests directory found — skipping tests"
          fi

      - name: Upload backend run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend-run.log

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          # You can set this secret in repository settings if needed
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:8000' }}
        run: npm run build

      - name: Run preview server (serve built assets) in background
        working-directory: frontend
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 5000 > ../frontend-preview.log 2>&1 &
          echo $! > ../frontend-preview.pid

      - name: Wait for frontend preview
        run: |
          echo "Waiting for http://localhost:5000/ (max 60s)"
          n=0
          until curl -sS http://localhost:5000/ > /dev/null 2>&1 || [ $n -ge 60 ]; do
            n=$((n+1))
            sleep 1
          done
          if [ $n -ge 60 ]; then
            echo "Frontend preview did not become ready in time. Showing preview log"; tail -n 200 ../frontend-preview.log; exit 1
          fi

      - name: Smoke test frontend preview
        run: |
          curl -sS http://localhost:5000/ | sed -n '1,120p'

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Upload frontend preview log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-preview-log
          path: frontend-preview.log

