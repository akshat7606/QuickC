server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker DNS resolver (default for Docker) so nginx can resolve container names at runtime
    resolver 127.0.0.11 valid=30s;

    # Proxy API requests to the backend container (compose service name: app).
    # Use a variable in proxy_pass so nginx performs DNS resolution at request time.
    location /api/ {
        set $backend "app:8000";
        proxy_pass http://$backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Also proxy /v1/ endpoints to backend (the frontend may call /v1/*)
    location /v1/ {
        set $backend_v1 "app:8000";
        proxy_pass http://$backend_v1/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: cache static assets
    location ~* \.(js|css|png|jpg|jpeg|svg|gif|ico|json)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
